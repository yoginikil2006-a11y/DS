<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>DS Digital Lab · Mohan Babu University</title>
<style>
/* ============ 1. TOKENS ============ */
:root{--bg:#f3f6fb;--card:#fff;--ink:#14213d;--muted:#5b6b82;--line:#e1e7f0;--pri:#1d3b6f;--pri2:#2f5fb3;--acc:#0e8f83;--soft:#eef3fb;--ok:#15803d;--bad:#b91c1c;--r:16px;--sh:0 1px 2px rgba(20,33,61,.05),0 10px 28px rgba(20,33,61,.08);--mono:ui-monospace,SFMono-Regular,Consolas,Menlo,monospace}
/* ============ 2. BASE ============ */
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;font:15px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:radial-gradient(900px 420px at 90% -8%,#dbe7ff 0,transparent 62%) no-repeat,radial-gradient(700px 380px at -6% 8%,#d6f1ec 0,transparent 58%) no-repeat,var(--bg)}
a{color:var(--pri2);text-decoration:none}a:hover{text-decoration:underline}
h1,h2,h3{line-height:1.25;margin:0}h1{font-size:clamp(26px,4vw,38px);letter-spacing:-.02em}h2{font-size:20px}h3{font-size:17px}
h1:focus{outline:none}
p{margin:0 0 10px}
:focus-visible{outline:3px solid #7aa7ff;outline-offset:2px;border-radius:6px}
.sr{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.skip{position:absolute;left:-999px;top:8px;background:#fff;padding:8px 12px;border-radius:8px;z-index:200}.skip:focus{left:8px}
.wrap{width:100%;max-width:1200px;margin:0 auto;padding:0 20px}
main{flex:1;padding:28px 0 56px;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.ic{flex:none;vertical-align:-3px}
.muted{color:var(--muted)}.eyebrow{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--acc);margin-bottom:6px}
.lead{color:var(--muted);font-size:16px;max-width:60ch}
/* ============ 3. HEADER / FOOTER ============ */
.hdr{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.hdr-in{display:flex;align-items:center;gap:20px;height:68px}
.brand{display:flex;align-items:center;gap:12px;color:var(--ink)}.brand:hover{text-decoration:none}
.logo{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px;box-shadow:0 4px 12px rgba(29,59,111,.3);border:3px solid #fff;outline:1px solid var(--line)}
.brand-t{display:flex;flex-direction:column;line-height:1.15}.brand-t b{font-size:16px}.brand-t small{color:var(--muted);font-size:11.5px}
.nav{display:flex;gap:4px;margin-left:auto}
.nav a{padding:9px 16px;border-radius:999px;color:var(--muted);font-weight:700;font-size:13px;letter-spacing:.06em}
.nav a:hover{background:var(--soft);text-decoration:none;color:var(--pri)}
.nav a.on{background:var(--pri);color:#fff}
.hdr-r{display:flex;gap:6px}
.icon-btn{border:1px solid var(--line);background:#fff;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;cursor:pointer;color:var(--pri)}
.icon-btn:hover{background:var(--soft)}.menu{display:none}
.ftr{background:#fff;border-top:1px solid var(--line);padding:28px 0;margin-top:auto}
.ftr-in{display:flex;flex-wrap:wrap;gap:20px 40px;justify-content:space-between;align-items:center}
.ftr nav{display:flex;gap:16px;flex-wrap:wrap}.ftr small{color:var(--muted)}
/* ============ 4. COMPONENTS ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 15px;border-radius:11px;font:inherit;font-weight:600;font-size:13.5px;cursor:pointer;transition:.15s}
.btn:hover{background:var(--soft);text-decoration:none;transform:translateY(-1px)}
.btn[disabled],.btn.off{opacity:.5;cursor:not-allowed;transform:none}
.btn-pri{background:var(--pri);color:#fff;border-color:var(--pri)}.btn-pri:hover{background:var(--pri2);border-color:var(--pri2)}
.btn-acc{background:var(--acc);color:#fff;border-color:var(--acc)}.btn-acc:hover{background:#0b7a70}
.btn-sm{padding:6px 11px;font-size:12.5px;border-radius:9px}.btn-ico{padding:7px}
.btn-danger{color:var(--bad)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:20px}
.chip{display:inline-block;background:var(--soft);color:var(--pri);padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;margin:0 4px 4px 0}
.chip.d{background:#fff7e6;color:#92580a}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.empty{padding:36px;text-align:center;color:var(--muted);background:#fff;border:1px dashed var(--line);border-radius:var(--r);grid-column:1/-1}.empty.sm{padding:16px}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 16px;min-width:120px;box-shadow:var(--sh)}.stat b{display:block;font-size:22px;color:var(--pri)}.stat span{font-size:12px;color:var(--muted)}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;font-size:13px;color:var(--muted);margin-bottom:14px}.crumbs span{opacity:.6}
/* home */
.home{display:grid;grid-template-columns:minmax(0,1fr) 330px;grid-template-areas:"hero aside" "search aside" "cards aside" "tiles aside";grid-template-rows:auto auto auto 1fr;gap:22px 28px;align-items:start}
.hero{grid-area:hero}.s-area{grid-area:search}.c-area{grid-area:cards}.t-area{grid-area:tiles}.aside{grid-area:aside;position:sticky;top:90px}
.searchbox{position:relative}
.q{width:100%;padding:14px 44px 14px 46px;border:1px solid var(--line);border-radius:14px;font:inherit;background:#fff;box-shadow:var(--sh)}
.searchbox>.ic{position:absolute;left:16px;top:16px;color:var(--muted)}
.clear{position:absolute;right:8px;top:8px;border:0;background:transparent;width:32px;height:32px;border-radius:8px;cursor:pointer;color:var(--muted)}.clear:hover{background:var(--soft)}
.results{position:absolute;left:0;right:0;top:56px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 40px rgba(20,33,61,.18);max-height:360px;overflow:auto;z-index:20;padding:6px}
.results.static{position:static;margin-top:10px;box-shadow:none}
.res{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;color:var(--ink)}.res:hover,.res.on{background:var(--soft);text-decoration:none}
.tag{font-size:10.5px;font-weight:800;letter-spacing:.07em;color:var(--acc);background:#e6f6f4;padding:2px 8px;border-radius:6px;white-space:nowrap}
.res-t{font-weight:600}.res-s{margin-left:auto;color:var(--muted);font-size:12.5px;text-align:right}
mark{background:#fff0a8;border-radius:3px;padding:0 1px}
/* exp card */
.exp-card{display:flex;flex-direction:column;gap:12px;transition:.18s}.exp-card:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(20,33,61,.12)}
.exp-top{display:flex;gap:14px}.thumb{width:92px;height:70px;flex:none;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:6px}.thumb svg{width:100%;height:100%;color:var(--pri2)}
.exp-card h3{margin-bottom:4px}.exp-card p{color:var(--muted);font-size:14px;margin:0}
.exp-foot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:auto}
.dots{display:flex;gap:6px}
.dot{width:32px;height:32px;border-radius:50%;border:2px solid var(--pri2);color:var(--pri2);display:grid;place-items:center;font-weight:700;font-size:13px;background:#fff}.dot:hover{background:var(--pri2);color:#fff;text-decoration:none}.dot.done{background:var(--ok);border-color:var(--ok);color:#fff}
.acts{margin-left:auto;display:flex;gap:4px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
.tile{display:flex;gap:14px;align-items:center;color:var(--ink);padding:22px}.tile:hover{text-decoration:none;transform:translateY(-3px)}
.tile .big{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;background:var(--soft);color:var(--pri)}
/* profile */
.profile{text-align:left}
.avatar{width:104px;height:104px;border-radius:50%;margin:0 auto 16px;background:linear-gradient(135deg,var(--pri),var(--acc));color:#fff;display:grid;place-items:center;font-size:34px;font-weight:800;overflow:hidden;border:4px solid #fff;box-shadow:0 0 0 1px var(--line),var(--sh)}.avatar img{width:100%;height:100%;object-fit:cover}
.kv{display:grid;grid-template-columns:96px 1fr;gap:8px 10px;margin:0 0 16px}.kv dt{color:var(--muted);font-size:13px}.kv dd{margin:0;font-weight:600;word-break:break-word}
.socials{display:flex;gap:10px;justify-content:center;margin-bottom:14px}
.soc{width:42px;height:42px;border-radius:50%;border:1.5px solid var(--pri2);display:grid;place-items:center;color:var(--pri2);background:#fff}.soc:hover{background:var(--pri2);color:#fff;text-decoration:none}.soc.disabled{border-color:var(--line);color:#a0aabb;cursor:not-allowed}.soc.disabled:hover{background:#fff;color:#a0aabb}
/* exp page */
.exp-layout{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:24px;align-items:start}
.subnav{position:sticky;top:90px;display:flex;flex-direction:column;gap:6px;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:10px;box-shadow:var(--sh)}
.subnav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;color:var(--ink);font-weight:600;font-size:13.5px}.subnav a:hover{background:var(--soft);text-decoration:none}.subnav a.on{background:var(--pri);color:#fff}
.subnav .L{width:26px;height:26px;border-radius:50%;border:2px solid currentColor;display:grid;place-items:center;font-size:12px;flex:none}.subnav .tk{margin-left:auto;color:var(--ok)}.subnav a.on .tk{color:#9ff0bf}
.block{margin-bottom:18px}.block h2{margin-bottom:8px;display:flex;align-items:center;gap:8px}
ol.steps{margin:0;padding-left:22px}ol.steps li{margin-bottom:6px}
.ed{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fbfcfe}
.gut{margin:0;padding:12px 8px;background:#f0f4fa;color:#8896ab;text-align:right;font:13px/1.55 var(--mono);overflow:hidden;min-width:42px;user-select:none;height:340px}
.code{flex:1;border:0;resize:vertical;padding:12px;height:340px;font:13px/1.55 var(--mono);color:#1b2a41;background:transparent;white-space:pre;overflow:auto;tab-size:4}.code:focus{outline:none}
.tb{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.out{background:#0f1b30;color:#e8eefc;border-radius:12px;padding:14px;min-height:90px}
.out .demo{background:#1c2c4a;color:#b8c9ea;border-radius:8px;padding:7px 10px;font-size:12.5px;margin-bottom:10px}
.outtext{margin:0;font:13px/1.5 var(--mono);white-space:pre;overflow:auto;max-height:420px}
.out.err{border:1px solid #f08a8a}.err-l{color:#ffb4b4}.ok-l{color:#8be9b0}
.plot{margin-top:12px;background:#fff;border-radius:10px;padding:10px;color:var(--ink)}.plot img{max-width:100%;display:block;margin:auto}
.plot-ph{border:2px dashed #b9c6dc;border-radius:10px;padding:26px;text-align:center;color:var(--muted)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid #7f94bd;border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}@keyframes sp{to{transform:rotate(360deg)}}
.pn{display:flex;justify-content:space-between;gap:10px;margin-top:16px;flex-wrap:wrap}
/* modules / pdf */
.mods{display:grid;grid-template-columns:260px minmax(0,1fr);gap:24px;align-items:start}
.mlist{display:flex;flex-direction:column;gap:8px}
.mi{display:block;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);font-weight:600}.mi small{display:block;color:var(--muted);font-weight:400}.mi:hover{background:var(--soft);text-decoration:none}.mi.on{border-color:var(--pri);background:var(--pri);color:#fff}.mi.on small{color:#c9d7f2}
.pdf{padding:0;overflow:hidden}.pdf-h{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);background:#fafcff}.pdf-h h2{margin-right:auto;font-size:16px}
.pdf-h input{width:60px;padding:6px;border:1px solid var(--line);border-radius:8px;font:inherit;text-align:center}
.pdf-b{background:#dfe6f1;padding:20px;min-height:520px;overflow:auto;display:flex;justify-content:center;align-items:flex-start}
.pdf:fullscreen{background:#fff;overflow:auto}
.paper{background:#fff;width:calc(520px*var(--z,1));max-width:none;aspect-ratio:1/1.35;box-shadow:0 6px 22px rgba(20,33,61,.18);padding:2.6em;font-size:calc(14px*var(--z,1));display:flex;flex-direction:column;gap:.7em}
.paper h3{font-size:1.5em}.paper .ln{height:.7em;background:#e8edf5;border-radius:4px}.paper .pn-n{margin-top:auto;text-align:center;color:var(--muted);font-size:.8em}
.pdf-frame{width:100%;height:640px;border:0;background:#fff}
/* tools */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.tab{border:1px solid var(--line);background:#fff;padding:7px 14px;border-radius:999px;cursor:pointer;font:inherit;font-weight:600;font-size:13px;color:var(--muted)}.tab.on,.tab:hover{background:var(--pri);color:#fff;border-color:var(--pri)}
.tool{display:flex;flex-direction:column;gap:10px}.mono-b{width:48px;height:48px;border-radius:14px;color:#fff;display:grid;place-items:center;font-weight:800;font-size:17px}
pre.snip{background:#0f1b30;color:#e8eefc;border-radius:12px;padding:14px;overflow:auto;font:13px/1.5 var(--mono);margin:8px 0}
.filters{display:grid;grid-template-columns:2fr repeat(3,1fr) auto;gap:10px;margin:18px 0}
.filters input,.filters select,.fld input,.fld select,.fld textarea{padding:10px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff;width:100%}
/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(20,33,61,.45);display:flex;justify-content:center;align-items:flex-start;padding:4vh 12px;overflow:auto;z-index:100;animation:fade .2s}
.modal{background:#fff;border-radius:18px;width:100%;max-width:860px;box-shadow:0 30px 80px rgba(0,0,0,.3)}.modal.sm{max-width:620px;padding:16px}
.m-h{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--line)}
.m-b{padding:18px 22px}.m-f{display:flex;justify-content:flex-end;gap:10px;padding:14px 22px;border-top:1px solid var(--line);flex-wrap:wrap}
.fld{margin-bottom:12px}.fld label{display:block;font-weight:600;font-size:13px;margin-bottom:4px}.fld textarea{font:13px/1.5 var(--mono);min-height:90px}.fld small{color:var(--muted)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
#toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:300}
.toast{background:var(--pri);color:#fff;padding:11px 16px;border-radius:12px;box-shadow:var(--sh);animation:fade .25s}.toast.bad{background:var(--bad)}
/* ============ 7. RESPONSIVE ============ */
@media(max-width:960px){
 .home{grid-template-columns:1fr;grid-template-areas:"hero" "search" "aside" "cards" "tiles"}.aside{position:static}
 .exp-layout{grid-template-columns:1fr}.subnav{position:static;flex-direction:row;overflow-x:auto}.subnav a span:not(.L){display:none}.subnav a:first-child span{display:inline}.subnav .tk{margin-left:0}
 .mods{grid-template-columns:1fr}.mlist{flex-direction:row;overflow-x:auto}.mi{min-width:170px}
 .filters{grid-template-columns:1fr 1fr}
}
@media(max-width:720px){
 .menu{display:grid}.nav{display:none;position:absolute;left:0;right:0;top:68px;background:#fff;border-bottom:1px solid var(--line);flex-direction:column;padding:10px 20px;margin:0}.nav.open{display:flex}
 .hdr-r{margin-left:auto}.tiles{grid-template-columns:1fr}.row2{grid-template-columns:1fr}.brand-t small{display:none}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

function buildIndex(){
  const a=[];
  EXPS.forEach(e=>{a.push({cat:'EXPERIMENT',title:e.title,sub:'Exp '+e.number,href:'#/experiments/'+e.id,hay:[e.description,e.overview,e.tools.join(' ')].join(' ')});
    e.subs.forEach(s=>a.push({cat:'SUB-EXPERIMENT',title:s.title,sub:`Exp ${e.number} · Part ${s.id}`,href:`#/experiments/${e.id}/${s.id}`,hay:s.aim+' '+s.code}));});
  MODULES.forEach(m=>a.push({cat:'MODULE',title:m.title,sub:'Module '+m.n,href:'#/modules/'+m.id,hay:m.topics.join(' ')}));
  TOOLS.forEach(t=>a.push({cat:'TOOL',title:t.name,sub:t.cat,href:'#/tools/'+t.id,hay:t.desc}));
  return a;
}
function search(q){
  const k=q.toLowerCase().split(/\s+/).filter(Boolean);if(!k.length)return[];
  return buildIndex().map(it=>{const t=it.title.toLowerCase(),h=(it.hay||'').toLowerCase();let sc=0;for(const w of k){if(t.includes(w))sc+=3;else if(h.includes(w))sc+=1;else return null;}return{it,sc};})
    .filter(Boolean).sort((a,b)=>b.sc-a.sc).slice(0,12).map(x=>x.it);
}
function bindSearch(input,box,done){
  let items=[],act=-1,timer;
  const mark=()=>{const els=$$('.res',box);els.forEach((a,i)=>{a.classList.toggle('on',i===act);a.setAttribute('aria-selected',String(i===act));});input.setAttribute('aria-activedescendant',act>=0?`${box.id}-o${act}`:'');if(els[act])els[act].scrollIntoView({block:'nearest'});};
  const draw=()=>{const q=input.value.trim();items=search(q);act=items.length?0:-1;
    if(!q){box.hidden=true;input.setAttribute('aria-expanded','false');return;}
    box.hidden=false;input.setAttribute('aria-expanded','true');
    box.innerHTML=items.length?items.map((it,i)=>`<a role="option" id="${box.id}-o${i}" href="${it.href}" class="res ${i===act?'on':''}" aria-selected="${i===act}"><span class="tag">${it.cat}</span><span class="res-t">${hl(it.title,q)}</span><span class="res-s">${esc(it.sub)}</span></a>`).join(''):'<div class="empty sm">No results found. Try another search.</div>';
    input.setAttribute('aria-activedescendant',act>=0?`${box.id}-o0`:'');};
  input.addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(draw,120);});
  input.addEventListener('keydown',e=>{
    if(e.key==='ArrowDown'&&items.length){e.preventDefault();act=(act+1)%items.length;mark();}
    else if(e.key==='ArrowUp'&&items.length){e.preventDefault();act=(act-1+items.length)%items.length;mark();}
    else if(e.key==='Enter'&&act>=0&&items[act]){e.preventDefault();location.hash=items[act].href;if(done)done();}
    else if(e.key==='Escape'&&input.value){e.stopPropagation();input.value='';box.hidden=true;}});
  box.addEventListener('click',e=>{if(e.target.closest('a')&&done)done();});
}

let CUR=null;
function syntaxCheck(code){
  if(!code.trim())return[{line:1,text:'Code is empty.'}];
  const msgs=[],pairs={')':'(',']':'[','}':'{'},stack=[];let i=0,line=1,str=null;
  while(i<code.length){
    const c=code[i],t3=code.substr(i,3);
    if(str){
      if(str.length===3){if(t3===str){str=null;i+=3;continue;}}
      else{if(c==='\\'){i+=2;continue;}if(c===str){str=null;}else if(c==='\n'){msgs.push({line,text:'Unterminated string literal.'});str=null;}}
      if(c==='\n')line++;i++;continue;
    }
    if(c==='#'){while(i<code.length&&code[i]!=='\n')i++;continue;}
    if(t3==='"""'||t3==="'''"){str=t3;i+=3;continue;}
    if(c==='"'||c==="'"){str=c;i++;continue;}
    if('([{'.includes(c))stack.push({c,line});
    else if(')]}'.includes(c)){const top=stack.pop();if(!top||top.c!==pairs[c])msgs.push({line,text:`Unmatched '${c}'.`});}
    if(c==='\n')line++;i++;
  }
  if(str)msgs.push({line,text:'Unterminated string literal.'});
  stack.forEach(s=>msgs.push({line:s.line,text:`'${s.c}' was never closed.`}));
  code.split('\n').forEach((l,n)=>{if(/^(\t+ +| +\t)/.test(l))msgs.push({line:n+1,text:'Mixed tabs and spaces in indentation.'});});
  return msgs;
}

      out.className='out'+(j.stderr?' err':'');
      out.innerHTML=`<pre class="outtext">${esc((j.stdout||'')+(j.stderr?'\n'+j.stderr:''))}</pre>`;
    }else{
      const errs=syntaxCheck(ta.value);
      if(errs.length){out.className='out err';out.innerHTML=`<pre class="outtext err-l">SyntaxError (basic check)\n${errs.map(e=>`  line ${e.line}: ${esc(e.text)}`).join('\n')}</pre>`;}
      else{const edited=ta.value.trim()!==CUR.code.trim();out.innerHTML=outputHTML(CUR,edited?'Code was edited, but this demo can only show the original saved output.':'Run complete. Showing saved output.');}
    }
  }catch(e){out.className='out err';out.innerHTML=`<pre class="outtext err-l">Error: ${esc(e.message)}</pre>`;}
  $$('[data-act=run],[data-act=compile]').forEach(b=>b.disabled=false);
}
async function sbCompile(){
  const out=$('#out'),ta=$('#code');if(!out||!ta)return;
  $$('[data-act=run],[data-act=compile]').forEach(b=>b.disabled=true);
  out.className='out';out.innerHTML='<span class="spin"></span> Checking…';await sleep(350);
  const errs=syntaxCheck(ta.value);
  out.className='out'+(errs.length?' err':'');
  out.innerHTML=errs.length?`<pre class="outtext err-l">Basic check found ${errs.length} problem(s):\n${errs.map(e=>`  line ${e.line}: ${esc(e.text)}`).join('\n')}</pre>`
    :`<pre class="outtext ok-l">✓ Basic syntax check passed (brackets, quotes, indentation).</pre><div class="demo" style="margin-top:10px">${ic('info',15)} This is a simple client-side check, not a real Python compiler.</div>`;
  $$('[data-act=run],[data-act=compile]').forEach(b=>b.disabled=false);
}
function sbReset(){const ta=$('#code');if(!ta)return;ta.value=CUR.code;ta.dispatchEvent(new Event('input'));$('#out').className='out';$('#out').innerHTML=outputHTML(CUR);toast('Code reset to original.');}
async function copyText(t){try{await navigator.clipboard.writeText(t);}catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');}catch(_){}a.remove();}toast('Copied to clipboard');}

function pageExp(id,subId){

   <div class="exp-layout"><div>${body}

     <div class="tb"><button class="btn btn-pri" data-act="run">${ic('play',15)} Run</button><button class="btn btn-acc" data-act="compile">${ic('check',15)} Compile</button><button class="btn" data-act="reset">${ic('refresh',15)} Reset</button><button class="btn" data-act="copycode">${ic('copy',15)} Copy</button></div>

    <div class="pn">${prev?`<a class="btn" href="${prev.h}">${ic('left',15)} ${prev.t}</a>`:'<span></span>'}
     ${sub?`<button class="btn ${isDone(e.id,sub.id)?'btn-acc':''}" data-act="done" data-exp="${esc(e.id)}" data-sub="${sub.id}">${ic('check',15)} ${isDone(e.id,sub.id)?'Completed':'Mark as complete'}</button>`:''}
     ${next?`<a class="btn btn-pri" href="${next.h}">${next.t} ${ic('right',15)}</a>`:'<span></span>'}</div></div>
    <nav class="subnav" aria-label="Experiment parts"><a class="${!sub?'on':''}" href="#/experiments/${esc(e.id)}"><span class="L">${ic('file',13)}</span><span>Overview</span></a>

let DR=null,DR_TAB='main';
const pad=n=>String(n).padStart(2,'0');
function nextNumber(){return pad(EXPS.reduce((m,e)=>Math.max(m,parseInt(e.number,10)||0),0)+1);}
function blankSub(i){return{id:'ABCDE'[i],title:'',aim:'',procedure:[],code:'',output:'',image:'',plot:false};}
function openEditor(id){
  DR=id?clone(getExp(id)):{id:'',number:nextNumber(),title:'',description:'',overview:'',tools:[],difficulty:'Beginner',subs:[]};
  DR.isNew=!id;while(DR.subs.length<5)DR.subs.push(blankSub(DR.subs.length));
  DR_TAB='main';drawModal();
}
function drawModal(){
  let m=$('#emodal');if(!m){m=document.createElement('div');m.id='emodal';m.className='modal-bg';document.body.appendChild(m);m.addEventListener('mousedown',e=>{if(e.target===m)closeModal();});}
  const tabs=['main'].concat('ABCDE'.split(''));
  let form;
  if(DR_TAB==='main'){
    form=`<div class="row2"><div class="fld"><label for="f-number">Experiment number *</label><input id="f-number" value="${esc(DR.number)}"></div>
     <div class="fld"><label for="f-diff">Difficulty</label><select id="f-diff">${['Beginner','Intermediate','Advanced'].map(d=>`<option ${d===DR.difficulty?'selected':''}>${d}</option>`).join('')}</select></div></div>
     <div class="fld"><label for="f-title">Title *</label><input id="f-title" value="${esc(DR.title)}"></div>
     <div class="fld"><label for="f-desc">Description</label><textarea id="f-desc" style="min-height:70px;font:inherit">${esc(DR.description)}</textarea><small id="wc"></small></div>
     <div class="fld"><label for="f-over">Overview</label><textarea id="f-over" style="min-height:90px;font:inherit">${esc(DR.overview)}</textarea></div>
     <div class="fld"><label for="f-tools">Tools (comma separated)</label><input id="f-tools" value="${esc(DR.tools.join(', '))}"></div>`;
  }else{
    const s=DR.subs['ABCDE'.indexOf(DR_TAB)];
    form=`<p class="muted">Leave the title empty to skip this part.</p><div class="fld"><label for="f-st">Part ${DR_TAB} title</label><input id="f-st" value="${esc(s.title)}"></div>
     <div class="fld"><label for="f-sa">Aim</label><textarea id="f-sa" style="min-height:60px;font:inherit">${esc(s.aim)}</textarea></div>
     <div class="fld"><label for="f-sp">Procedure (one step per line)</label><textarea id="f-sp">${esc(s.procedure.join('\n'))}</textarea></div>
     <div class="fld"><label for="f-sc">Code</label><textarea id="f-sc" style="min-height:160px">${esc(s.code)}</textarea></div>
     <div class="fld"><label for="f-so">Output</label><textarea id="f-so">${esc(s.output)}</textarea></div>
     <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="f-plot" ${s.plot?'checked':''} style="width:auto"> This part produces a plot (shows the PNG slot)</label>`;
  }
  m.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt"><div class="m-h"><h2 id="mt">${DR.isNew?'Add Experiment':'Edit Experiment'}</h2><button class="icon-btn" data-act="closemodal" aria-label="Close">${ic('x')}</button></div>
   <div class="m-b"><div class="tabs" role="tablist">${tabs.map(t=>`<button class="tab ${t===DR_TAB?'on':''}" data-act="mtab" data-tab="${t}" role="tab" aria-selected="${t===DR_TAB}">${t==='main'?'Details':'Part '+t}</button>`).join('')}</div><div class="fld-wrap">${form}</div></div>
   <div class="m-f">${DR.isNew?'':`<button class="btn btn-danger" style="margin-right:auto" data-act="mresetone">${ic('refresh',15)} Reset to default</button>`}<button class="btn" data-act="closemodal">Cancel</button><button class="btn btn-pri" data-act="msave">Save Changes</button></div></div>`;
  updWC();const f=$('input,textarea,select',m);if(f)f.focus();
}
function updWC(){const d=$('#f-desc'),w=$('#wc');if(d&&w){const n=d.value.trim()?d.value.trim().split(/\s+/).length:0;w.textContent=`${n} words (about 15 recommended)`;}}
function readForm(){
  if(!$('#emodal'))return;
  if(DR_TAB==='main'){DR.number=$('#f-number').value.trim();DR.title=$('#f-title').value.trim();DR.description=$('#f-desc').value.trim();DR.overview=$('#f-over').value.trim();DR.difficulty=$('#f-diff').value;DR.tools=$('#f-tools').value.split(',').map(s=>s.trim()).filter(Boolean);}
  else{const s=DR.subs['ABCDE'.indexOf(DR_TAB)];s.title=$('#f-st').value.trim();s.aim=$('#f-sa').value.trim();s.procedure=$('#f-sp').value.split('\n').map(x=>x.trim()).filter(Boolean);s.code=$('#f-sc').value;s.output=$('#f-so').value;s.plot=$('#f-plot').checked;}
}
function closeModal(){const m=$('#emodal');if(m)m.remove();DR=null;}
function saveModal(){
  readForm();
  if(!DR.title){DR_TAB='main';drawModal();toast('Title is required.',true);return;}
  if(!DR.number){DR_TAB='main';drawModal();toast('Experiment number is required.',true);return;}
  if(EXPS.some(e=>e.number===DR.number&&e.id!==DR.id)){DR_TAB='main';drawModal();toast('That experiment number is already used.',true);return;}
  const subs=DR.subs.filter(s=>s.title||s.code.trim()).map((s,i)=>({...s,id:'ABCDE'[i],title:s.title||'Part '+'ABCDE'[i]}));
  const e={...DR,subs};delete e.isNew;
  if(DR.isNew){e.id='exp-'+Date.now().toString(36);EXPS.push(e);}else{const i=EXPS.findIndex(x=>x.id===DR.id);EXPS[i]=e;}
  saveExps();closeModal();toast('Experiment saved.');route();
}
function deleteExp(id){
  const e=getExp(id);if(!e)return;
  if(!confirm(`Delete Experiment ${e.number}: ${e.title}?\nThis cannot be undone (you can reset to defaults later).`))return;
  EXPS=EXPS.filter(x=>x.id!==id);delete DONE[id];saveExps();saveDone();toast('Experiment deleted.');
  if(/^#\/experiments\//.test(location.hash))location.hash='#/experiments';else route();
}
function exportJSON(){const b=new Blob([JSON.stringify(EXPS,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='ds-lab-experiments.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);}

/* ==========================================================
   10. ROUTER & RENDER
   ========================================================== */
function render(p){
  closeSearch();
  $('#app').innerHTML=header(p.active)+`<main id="main">${p.html}</main>`+footer();
  document.title=`${p.title} · ${CONFIG.portal.name} · ${CONFIG.portal.university}`;
  window.scrollTo(0,0);
  if(p.after)p.after();
  const h=$('#h1');if(h)h.focus({preventScroll:true});
}
function route(){
  const parts=location.hash.replace(/^#\/?/,'').split('/').filter(Boolean).map(decodeURIComponent);
  let p;
  if(!parts.length)p=pageHome();
  else if(parts[0]==='experiments')p=parts.length===1?pageExpList():pageExp(parts[1],parts[2]);
  else if(parts[0]==='modules')p=pageModules(parts[1]);
  else if(parts[0]==='tools')p=parts.length===1?pageTools():pageTool(parts[1]);
  else p=notFound();
  render(p);
}

/* ==========================================================
   11. EVENTS
   ========================================================== */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,m=MODULES.find(x=>x.id===PV.id);
  const redraw=()=>{const pp=$('#pdfpanel');if(pp&&m)pp.innerHTML=pdfView(m);};
  switch(a){
    case 'search':openSearch();break;
    case 'menu':{const n=$('#nav'),o=n.classList.toggle('open');b.setAttribute('aria-expanded',String(o));break;}
    case 'clearq':{const i=b.parentElement.querySelector('input');i.value='';i.dispatchEvent(new Event('input'));i.focus();break;}
    case 'run':sbRun();break;
    case 'compile':sbCompile();break;
    case 'reset':sbReset();break;
    case 'copycode':copyText($('#code').value);break;
    case 'copytxt':copyText($('#'+b.dataset.target).textContent);break;
    case 'done':{const ex=b.dataset.exp,sb=b.dataset.sub;DONE[ex]=DONE[ex]||{};DONE[ex][sb]=!DONE[ex][sb];saveDone();toast(DONE[ex][sb]?'Marked as complete.':'Marked as not complete.');route();break;}
    case 'add':openEditor(null);break;
    case 'edit':openEditor(b.dataset.id);break;
    case 'del':deleteExp(b.dataset.id);break;
    case 'closemodal':closeModal();break;
    case 'msave':saveModal();break;
    case 'mtab':readForm();DR_TAB=b.dataset.tab;drawModal();break;
    case 'mresetone':{const d=DEFAULTS.find(x=>x.id===DR.id);if(d){const keep=DR.id;DR=clone(d);DR.id=keep;while(DR.subs.length<5)DR.subs.push(blankSub(DR.subs.length));toast('Fields reset. Press Save to apply.');drawModal();}else toast('No default exists for this experiment.',true);break;}
    case 'clearf':['fq','fd','ft'].forEach(i=>{$('#'+i).value='';});$('#fs').value='num';drawList();break;
    case 'export':exportJSON();break;
    case 'import':{let f=$('#impfile');if(!f){f=document.createElement('input');f.type='file';f.accept='application/json';f.id='impfile';f.hidden=true;document.body.appendChild(f);}f.value='';f.click();break;}
    case 'resetdata':if(confirm('Reset all experiments to the original defaults? Your edits will be lost.')){EXPS=clone(DEFAULTS);DONE={};saveExps();saveDone();toast('Defaults restored.');route();}break;
    case 'upload':{let f=$('#imgfile');if(!f){f=document.createElement('input');f.type='file';f.accept='image/*';f.id='imgfile';f.hidden=true;document.body.appendChild(f);}f.value='';f.click();break;}
    case 'tcat':drawTools(b.dataset.cat);break;
    case 'pdf-prev':PV.page=Math.max(1,PV.page-1);redraw();break;
    case 'pdf-next':PV.page=Math.min(m.pages,PV.page+1);redraw();break;
    case 'pdf-zin':PV.zoom=Math.min(2,+(PV.zoom+.1).toFixed(2));redraw();break;
    case 'pdf-zout':PV.zoom=Math.max(.5,+(PV.zoom-.1).toFixed(2));redraw();break;
    case 'pdf-zreset':PV.zoom=1;redraw();break;
    case 'pdf-retry':redraw();toast('Reloading PDF…');break;
    case 'pdf-full':{const pp=$('#pdfpanel');if(pp&&pp.requestFullscreen)pp.requestFullscreen();else toast('Full screen is not supported here.',true);break;}
  }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='pg'){const m=MODULES.find(x=>x.id===PV.id);PV.page=Math.min(m.pages,Math.max(1,parseInt(t.value,10)||1));$('#pdfpanel').innerHTML=pdfView(m);}
  else if(t.id==='imgfile'&&t.files[0]){const f=t.files[0],r=new FileReader();r.onload=()=>{const ex=getExp(CUR.expId);const s=ex&&ex.subs.find(x=>x.id===CUR.subId);if(s){s.image=r.result;if(saveExps())toast('Plot image saved.');route();}};r.readAsDataURL(f);}
  else if(t.id==='impfile'&&t.files[0]){const r=new FileReader();r.onload=()=>{try{const a=JSON.parse(r.result);if(!Array.isArray(a)||!a.every(x=>x&&x.id&&x.title&&Array.isArray(x.subs)))throw new Error('Invalid file');EXPS=a;saveExps();toast('Experiments imported.');route();
}catch(e){toast('Invalid JSON file.',true);}};r.readAsText(t.files[0]);}
  else if(t.matches&&t.matches('[data-filter]'))drawList();
  else if(t.matches&&t.matches('[data-tfilter]'))drawTools();
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.matches&&t.matches('[data-filter]'))drawList();
  else if(t.matches&&t.matches('[data-tfilter]'))drawTools();
  else if(t.id==='f-desc')updWC();
});
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();openSearch();}
  if(e.key==='Escape')closeSearch();
});
window.addEventListener('hashchange',route);
route();
})();
</script>
